name: Build and deploy

on:
  pull_request:
    branches: [main]
    paths-ignore: ['infra/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['infra/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build image (smoke test)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t calc:${{ github.sha }} .

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name calc -p 8080:80 calc:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://localhost:8080/src/web-calculator.html && exit 0
            sleep 1
          done
          docker logs calc
          exit 1

  deploy:
    name: Build, push and deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "uri=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          params=$(jq -nc --arg img "$IMAGE_URI" '{commands: ["/usr/local/bin/calc-deploy \($img)"]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "calc deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Wait for completion (do not fail here so output is always printed).
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json > result.json
          jq -r '.Stdout' result.json
          jq -r '.Stderr' result.json >&2
          status=$(jq -r '.Status' result.json)
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Verify site is up
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          URL="http://$IP/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "OK: $URL returned 200"
              echo "### Deployed :rocket: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i: HTTP $code"; sleep 3
          done
          echo "::error::$URL did not return 200"
          exit 1
